name: Close stale issues

on:
  schedule: # Run 5 minutes after midnight daily.
  - cron: '5 0 * * *'

permissions:
  contents: read

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
      with:
        start-date: '2022-03-01T00:00:00Z' # ISO 8601 or RFC 2822
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 180
        days-before-close: 14
        stale-issue-label: stale
        close-issue-message: >
            This issue has been automatically closed due to lack of activity.
            If you feel this issue is still important, please reopen it and leave a comment.
        exempt-issue-labels: 'breaking-change,Pri0,:watch: Not Triaged,'
        operations-per-run: 50
        debug-only: true
